# Local development database only. These credentials are for your laptop, not production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: subplug-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: subplug
      POSTGRES_PASSWORD: subplug
      POSTGRES_DB: subplug
      TZ: Africa/Lagos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subplug -d subplug"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
